name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 5 minutes to prevent Render free tier spin-down
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://resume-matcher-gw36.onrender.com/api/v1/health)
          echo "Response: $response"
          if [ "$response" = "200" ]; then
            echo "Backend is alive!"
          else
            echo "Backend returned $response - may be starting up"
          fi
