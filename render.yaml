services:
  - type: web
    name: resume-matcher-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: apps/backend
    dockerfilePath: apps/backend/Dockerfile.render
    healthCheckPath: /api/v1/health

    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: FRONTEND_BASE_URL
        value: https://resume-matcher-zeta.vercel.app
      - key: CORS_ORIGINS
        value: '["https://resume-matcher-zeta.vercel.app"]'
      - key: LOG_LEVEL
        value: INFO
      - key: REQUEST_TIMEOUT_SECONDS
        value: "240"
      # DATABASE_URL and LLM_API_KEY must be set in the Render dashboard (not here)
