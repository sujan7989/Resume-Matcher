services:
  - type: web
    name: resume-matcher-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: apps/backend
    dockerfilePath: Dockerfile.render
    healthCheckPath: /api/v1/health

    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1.5
      - key: FRONTEND_BASE_URL
        value: https://resume-matcher.vercel.app
      - key: CORS_ORIGINS
        value: '["https://resume-matcher.vercel.app","https://resume-matcher-git-main-sujan7989.vercel.app","https://resume-matcher-sujan7989.vercel.app","http://localhost:3000"]'
      - key: LOG_LEVEL
        value: INFO
      - key: REQUEST_TIMEOUT_SECONDS
        value: "300"
      # LLM_API_KEY and DATABASE_URL must be set in the Render dashboard (not here)
