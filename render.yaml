services:
  - type: web
    name: resume-matcher-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: deepseek/deepseek-chat
      - key: LLM_API_KEY
        sync: false   # Set this manually in Render dashboard (secret)
      - key: FRONTEND_BASE_URL
        value: https://resume-matcher-zeta.vercel.app
      - key: CORS_ORIGINS
        value: '["https://resume-matcher-zeta.vercel.app"]'
      - key: LOG_LEVEL
        value: INFO
      - key: REQUEST_TIMEOUT_SECONDS
        value: "240"
