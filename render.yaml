services:
  - type: web
    name: resume-matcher-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: apps/backend
    healthCheckPath: /api/v1/health

    envVars:
      - key: PORT
        value: "10000"
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: deepseek/deepseek-chat
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://resume-matcher-zeta.vercel.app
      - key: CORS_ORIGINS
        value: '["https://resume-matcher-zeta.vercel.app"]'
      - key: LOG_LEVEL
        value: INFO
      - key: REQUEST_TIMEOUT_SECONDS
        value: "240"
